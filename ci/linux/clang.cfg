# Clang takes GCC 16's libstdc++ and runtime from /usr/local, not those of Debian's GCC 14, which
# it would otherwise choose. The image installs this as both clang.cfg and clang++.cfg beside
# Clang, so the presets can name `clang` plainly.
--gcc-install-dir=/usr/local/lib/gcc/x86_64-linux-gnu/16.2.0
